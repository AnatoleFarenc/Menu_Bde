<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sandwich BDE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <h1>Sandwich BDE</h1>
    <span class="tagline">Fait sur place, à commander à l'avance</span>
  </div>
  <div id="auth-area"></div>
</header>

<main>
  <div class="tabs" id="type-tabs"></div>
  <div class="grid" id="product-grid"></div>
</main>

<div class="cart" id="cart-box" style="display:none">
  <h3>Panier</h3>
  <div id="cart-items"></div>
  <div class="cart-total"><span>Total</span><span id="cart-total">0,00 €</span></div>
  <div class="field" style="margin-top:10px">
    <label for="pickup-time">Créneau de retrait souhaité</label>
    <input id="pickup-time" type="time">
  </div>
  <div class="field">
    <label for="order-note">Note (allergies, précisions...)</label>
    <textarea id="order-note" rows="2"></textarea>
  </div>
  <button id="checkout-btn" style="width:100%">Valider la commande</button>
  <div id="checkout-msg" style="margin-top:8px;font-size:0.85rem"></div>
</div>

<script src="/js/app.js"></script>
</body>
</html>
