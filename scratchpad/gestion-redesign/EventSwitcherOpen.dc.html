<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #f7f6f2; color: #262220; }
    .icon { display: block; flex-shrink: 0; }
  </style>
</helmet>

<div style="width: 460px; min-height: 480px; background: #f7f6f2; position: relative;">

  <!-- TOP BAR FRAGMENT -->
  <div style="height: 64px; flex-shrink: 0; background: #ffffff; border-bottom: 1px solid #e6e1d6; display: flex; align-items: center; padding: 0 20px; gap: 14px;">
    <div style="width: 32px; height: 32px; border-radius: 8px; background: #35618f; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px;">42</div>
    <div style="width: 1px; height: 24px; background: #e6e1d6;"></div>
    <button style="display: flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 8px; border: 1px solid #35618f; background: #ffffff; cursor: pointer; font-size: 13px; font-weight: 600; color: #262220; box-shadow: 0 0 0 3px rgba(53,97,143,0.1);">
      <span style="width: 7px; height: 7px; border-radius: 50%; background: #4c7a3f; flex-shrink: 0;"></span>
      Sandwich Piscine Septembre 2026
      <svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#35618f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
    </button>
  </div>

  <!-- DROPDOWN PANEL -->
  <div style="position: absolute; top: 68px; left: 20px; width: 340px; background: #ffffff; border: 1px solid #e6e1d6; border-radius: 12px; box-shadow: 0 16px 40px rgba(38,34,32,0.16); padding: 10px; display: flex; flex-direction: column; gap: 4px;">

    <div style="display: flex; align-items: center; gap: 6px; background: #f7f6f2; border: 1px solid #e6e1d6; border-radius: 8px; padding: 7px 10px; margin-bottom: 6px; color: #a39a8d;">
      <svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <span style="font-size: 13px;">Rechercher un événement...</span>
    </div>

    <div style="font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; color: #a39a8d; padding: 6px 8px 2px;">En cours</div>
    <div style="display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 8px; background: rgba(53,97,143,0.08);">
      <span style="width: 7px; height: 7px; border-radius: 50%; background: #4c7a3f; flex-shrink: 0;"></span>
      <span style="font-size: 13px; font-weight: 700; color: #2b4f76;">Sandwich Piscine Septembre 2026</span>
      <svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#2b4f76" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-left: auto;"><polyline points="20 6 9 17 4 12"/></svg>
    </div>

    <div style="font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; color: #a39a8d; padding: 10px 8px 2px;">Terminés</div>
    <div style="display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 8px;">
      <span style="width: 7px; height: 7px; flex-shrink: 0;"></span>
      <span style="font-size: 13px; font-weight: 600;">Boisson/Sucrée</span>
    </div>
    <div style="display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 8px;">
      <span style="width: 7px; height: 7px; flex-shrink: 0;"></span>
      <span style="font-size: 13px; font-weight: 600;">Petit-Dej</span>
    </div>
    <div style="display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 8px;">
      <span style="width: 7px; height: 7px; flex-shrink: 0;"></span>
      <span style="font-size: 13px; font-weight: 600;">Piscine septembre 2026</span>
    </div>

    <div style="height: 1px; background: #e6e1d6; margin: 6px 2px;"></div>

    <button style="display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 8px; border: none; background: transparent; color: #35618f; font-size: 13px; font-weight: 700; cursor: pointer; text-align: left;">
      <svg class="icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Nouvel événement
    </button>

  </div>
</div>
</x-dc>
</body>
</html>
