version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
      - "5001:5001"
    volumes:
      - ./server/data:/app/server/data
    environment:
      - PORT=5001
      - INTRA42_CLIENT_ID=${INTRA42_CLIENT_ID}
      - INTRA42_CLIENT_SECRET=${INTRA42_CLIENT_SECRET}
      - INTRA42_REDIRECT_URI=${INTRA42_REDIRECT_URI:-http://localhost:3000/api/auth/42/callback}
      - ADMIN_LOGINS=${ADMIN_LOGINS}
