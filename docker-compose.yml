services:
  app:
    build: .
    ports:
      - "3000:3000"
      - "5001:5001"
    environment:
      - NODE_ENV=production
      - PORT=5001
      - PUBLIC_APP_URL=${PUBLIC_APP_URL:-http://localhost:5001}
      - INTRA42_CLIENT_ID=${INTRA42_CLIENT_ID}
      - INTRA42_CLIENT_SECRET=${INTRA42_CLIENT_SECRET}
      # Optional: derived from PUBLIC_APP_URL if not set.
      - INTRA42_REDIRECT_URI=${INTRA42_REDIRECT_URI:-}
      - ADMIN_LOGINS=${ADMIN_LOGINS}
      - DATABASE_URL=mysql://bde_app:devpassword@mariadb:3306/bde_sandwich
    depends_on:
      - mariadb

  # Database for local development (staging/prod use native MariaDB on the
  # VPS, see infra/setup-mariadb.sh).
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: bde_sandwich
      MARIADB_USER: bde_app
      MARIADB_PASSWORD: devpassword
      MARIADB_ROOT_PASSWORD: rootdevpassword
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./docker/mariadb-init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  mariadb_data:
