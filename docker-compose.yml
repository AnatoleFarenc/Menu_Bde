version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
      - "5001:5001"
    volumes:
      - ./server/data:/app/server/data
    environment:
      - NODE_ENV=production
      - PORT=5001
      - PUBLIC_APP_URL=${PUBLIC_APP_URL:-http://localhost:5001}
      - INTRA42_CLIENT_ID=${INTRA42_CLIENT_ID}
      - INTRA42_CLIENT_SECRET=${INTRA42_CLIENT_SECRET}
      # Optionnel : déduit de PUBLIC_APP_URL si non défini.
      - INTRA42_REDIRECT_URI=${INTRA42_REDIRECT_URI:-}
      - ADMIN_LOGINS=${ADMIN_LOGINS}
      - DATABASE_URL=mysql://bde_app:devpassword@mariadb:3306/bde_sandwich
    depends_on:
      - mariadb

  # Base de données pour le développement local (staging/prod utilisent
  # MariaDB natif sur le VPS, voir infra/setup-mariadb.sh).
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: bde_sandwich
      MARIADB_USER: bde_app
      MARIADB_PASSWORD: devpassword
      MARIADB_ROOT_PASSWORD: rootdevpassword
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data:
